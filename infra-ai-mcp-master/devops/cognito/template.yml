AWSTemplateFormatVersion: '2010-09-09'
Description: Cognito User Pool with Hosted UI (OAuth enabled)

Parameters:
  AppName:
    Type: String
    Default: mcp-multitenant-auth

  CallbackURL:
    Type: String
    Default: https://mcp.infraconsulting.com.au/callback
    Description: Must be whitelisted in the Cognito App Integration

  AdditionalCallbackURL:
    Type: String
    Default: https://mcp.infraai.com.au/callback
    Description: Additional callback URL to be whitelisted in the Cognito App Integration

Resources:

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref AppName
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "Your InfraAI MCP Account"
          EmailMessage: |
            <html>
              <body style="font-family: Arial, sans-serif; font-size: 14px; color: #333;">
                <p>Hello,</p>
                <p>Your InfraAI MCP account has been created.</p>
                <p>
                  <strong>Login Portal:</strong><br/>
                  <a href="https://mcp.infraconsulting.com.au">https://mcp.infraconsulting.com.au</a>
                </p>
                <p><strong>Username:</strong><br/>{username}</p>
                <p><strong>Temporary Password:</strong><br/>{####}</p>
                <p>Please login and change your password immediately.</p>
                <p>If you did not expect this invitation, please ignore this email.</p>
                <p>Regards,<br/>InfraAI Team</p>
              </body>
            </html>
          SMSMessage: "InfraAI MCP Login\nUsername: {username}\nTemp Password: {####}"
      Schema:
        - Name: email
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Ref AppName
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true  # backend use
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - openid
        - email
        - profile
      CallbackURLs:
        - !Ref CallbackURL
        - !Ref AdditionalCallbackURL
      LogoutURLs:
        - !Ref CallbackURL
        - !Ref AdditionalCallbackURL
      SupportedIdentityProviders:
        - COGNITO
      PreventUserExistenceErrors: ENABLED

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "mcp-infra-ai"
      UserPoolId: !Ref CognitoUserPool

Outputs:

  UserPoolId:
    Value: !Ref CognitoUserPool

  ClientId:
    Value: !Ref CognitoUserPoolClient

  HostedUIDomain:
    Value: !Sub "https://${AppName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com"

  LoginURL:
    Value: !Sub >
      https://${AppName}-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com/login
      ?client_id=${CognitoUserPoolClient}
      &response_type=code
      &scope=openid+email
      &redirect_uri=${CallbackURL}