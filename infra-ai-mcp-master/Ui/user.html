<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InfraAI — Workspace</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0c0c0b; --surface: #141413; --border: #252521; --border-hi: #3a3a36;
      --text: #e8e8e4; --muted: #7a7a72; --faint: #3a3a36;
      --acid: #c8f135; --acid-dim: rgba(200,241,53,.1); --acid-border: rgba(200,241,53,.25);
      --red: #ff6b6b;
    }
    html, body { height: 100%; font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); }
    .mono { font-family: 'IBM Plex Mono', monospace; }

    /* ── grid bg ── */
    .grid-bg {
      background-image: linear-gradient(rgba(200,241,53,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(200,241,53,.035) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── LOGIN SCREEN ── */
    #loginScreen {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 0;
      position: relative; overflow: hidden;
    }
    #loginScreen::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(200,241,53,.06) 0%, transparent 70%);
      pointer-events: none;
    }
    .login-logo { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
    .login-logo-icon {
      width: 44px; height: 44px; background: var(--acid); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
    }
    .login-logo-text { font-size: 22px; font-weight: 600; letter-spacing: -.5px; }
    .login-logo-text span { color: var(--acid); }
    .login-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 40px 48px; text-align: center;
      width: 100%; max-width: 420px; position: relative;
    }
    .login-card h1 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .login-card p { font-size: 13px; color: var(--muted); margin-bottom: 32px; line-height: 1.6; }
    .btn-login {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--acid); color: #0c0c0b; font-weight: 600;
      font-size: 13px; padding: 12px 28px; border-radius: 10px;
      border: none; cursor: pointer; transition: all .15s; width: 100%;
      justify-content: center; font-family: 'IBM Plex Sans', sans-serif;
    }
    .btn-login:hover { background: #d8ff4a; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(200,241,53,.2); }
    .login-footer { margin-top: 24px; font-size: 11px; color: var(--faint); font-family: 'IBM Plex Mono', monospace; }

    /* ── APP SCREEN ── */
    #appScreen { display: none; flex-direction: column; height: 100vh; }
    header {
      border-bottom: 1px solid var(--border); background: rgba(12,12,11,.85);
      backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50;
      padding: 0 24px; height: 52px; display: flex; align-items: center; justify-content: space-between;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .logo-icon {
      width: 28px; height: 28px; background: var(--acid); border-radius: 7px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .logo-text { font-size: 13px; font-weight: 600; }
    .logo-text span { color: var(--acid); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .user-badge {
      font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--acid);
      background: var(--acid-dim); border: 1px solid var(--acid-border);
      padding: 4px 10px; border-radius: 20px; display: flex; align-items: center; gap: 6px;
    }
    .btn-signout {
      font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted);
      background: transparent; border: 1px solid var(--border); border-radius: 6px;
      padding: 4px 10px; cursor: pointer; transition: all .15s;
    }
    .btn-signout:hover { color: var(--text); border-color: var(--border-hi); }

    /* ── WORKSPACE ── */
    .workspace { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 52px); }
    .sidebar { width: 240px; border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .sidebar-section { padding: 16px; border-bottom: 1px solid var(--border); }
    .sidebar-label { font-size: 9px; font-family: 'IBM Plex Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 8px; }
    .folder-btn {
      display: block; width: 100%; text-align: left; font-size: 12px;
      font-family: 'IBM Plex Mono', monospace; color: var(--muted);
      background: transparent; border: none; border-radius: 6px;
      padding: 7px 10px; cursor: pointer; transition: all .12s; margin-bottom: 2px;
    }
    .folder-btn:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .folder-btn.active { background: var(--acid-dim); color: var(--acid); }

    .file-list-wrap { flex: 1; overflow-y: auto; padding: 12px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--muted);
      padding: 7px 10px; border-radius: 6px; cursor: pointer; transition: all .1s;
      margin-bottom: 2px;
    }
    .file-item:hover { background: rgba(255,255,255,.04); color: var(--text); }
    .file-item.active { background: var(--acid-dim); color: var(--acid); }
    .file-item-del { opacity: 0; font-size: 14px; line-height: 1; color: var(--red); transition: opacity .1s; }
    .file-item:hover .file-item-del { opacity: 1; }
    .file-empty { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--faint); padding: 8px 10px; }

    .sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
    .btn-new {
      width: 100%; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      background: transparent; border: 1px dashed var(--faint); border-radius: 6px;
      color: var(--muted); padding: 8px; cursor: pointer; transition: all .15s;
    }
    .btn-new:hover { border-color: var(--acid); color: var(--acid); background: var(--acid-dim); }

    /* ── EDITOR ── */
    .editor-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .editor-topbar {
      height: 44px; border-bottom: 1px solid var(--border); display: flex;
      align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0;
    }
    .active-file-label { font-size: 12px; font-family: 'IBM Plex Mono', monospace; color: var(--acid); }
    .dirty-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); display: none; margin-left: 8px; }
    .btn-save {
      font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      background: var(--acid); color: #0c0c0b; border: none; border-radius: 6px;
      padding: 6px 16px; cursor: pointer; font-weight: 600; transition: all .15s;
    }
    .btn-save:disabled { opacity: .35; cursor: not-allowed; }
    .btn-save:not(:disabled):hover { background: #d8ff4a; }
    textarea#fileEditor {
      flex: 1; width: 100%; resize: none; border: none; outline: none;
      background: transparent; color: var(--text); font-family: 'IBM Plex Mono', monospace;
      font-size: 13px; line-height: 1.7; padding: 24px;
    }
    textarea#fileEditor::placeholder { color: var(--faint); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 20px; font-size: 12px; font-family: 'IBM Plex Mono', monospace;
      transition: transform .25s ease; z-index: 999; pointer-events: none;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }
    #toast.ok  { border-color: var(--acid-border); color: var(--acid); }
    #toast.err { border-color: rgba(255,107,107,.3); color: var(--red); }

    /* ── SPINNER ── */
    .spin { animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--faint); border-radius: 2px; }
  </style>
</head>
<body class="grid-bg">

<!-- ── APP ── -->
<div id="appScreen">
  <header>
    <div class="header-left">
      <div class="logo-icon">
        <svg width="16" height="16" viewBox="0 0 14 14" fill="none">
          <rect x="1" y="1" width="5" height="5" fill="#0c0c0b"/>
          <rect x="8" y="1" width="5" height="5" fill="#0c0c0b"/>
          <rect x="1" y="8" width="5" height="5" fill="#0c0c0b"/>
          <rect x="8" y="8" width="5" height="5" fill="#0c0c0b" opacity=".4"/>
        </svg>
      </div>
      <span class="logo-text">Infra<span>AI</span> Workspace</span>
    </div>
    <div class="header-right">
      <span class="user-badge">
        <svg width="10" height="10" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/>
        </svg>
        <span id="userEmail">—</span>
      </span>
      <button class="btn-signout" onclick="window.cognito.logout()">sign out</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">Folder</div>
        <button class="folder-btn active" id="fb-templates" onclick="setFolder('templates',this)">📄 templates</button>
        <button class="folder-btn" id="fb-context"   onclick="setFolder('context',this)">🗂 context</button>
        <button class="folder-btn" id="fb-prompts"   onclick="setFolder('prompts',this)">✨ prompts</button>
      </div>
      <div class="file-list-wrap" id="fileList">
        <p class="file-empty">Loading…</p>
      </div>
      <div class="sidebar-footer">
        <button class="btn-new" onclick="createFile()">＋ New file</button>
      </div>
    </div>

    <!-- Editor -->
    <div class="editor-wrap">
      <div class="editor-topbar">
        <div style="display:flex;align-items:center">
          <span class="active-file-label" id="fileLabel">no file selected</span>
          <span class="dirty-dot" id="dirtyDot"></span>
        </div>
        <button class="btn-save" id="btnSave" disabled onclick="saveFile()">SAVE</button>
      </div>
      <textarea id="fileEditor" placeholder="# Select or create a file to get started…" oninput="onEdit()"></textarea>
    </div>
  </div>
</div>

<div id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
<script>
// ─── State ─────────────────────────────────────────────────────────────────────
const api = window.infraApi;
let activeFolder = 'templates';
let activeFile   = null;
let isDirty      = false;

// ─── UI helpers ────────────────────────────────────────────────────────────────
function toast(msg, type='ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = `show ${type}`;
  clearTimeout(el._t);
  el._t = setTimeout(() => el.className = '', 2400);
}

function setDirty(v) {
  isDirty = v;
  document.getElementById('dirtyDot').style.display = v && activeFile ? 'block' : 'none';
  document.getElementById('btnSave').disabled = !v || !activeFile;
}

// ─── Folder/file logic ─────────────────────────────────────────────────────────
function setFolder(name, el) {
  activeFolder = name;
  document.querySelectorAll('.folder-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  activeFile = null;
  document.getElementById('fileLabel').textContent = 'no file selected';
  document.getElementById('fileEditor').value = '';
  setDirty(false);
  loadFiles();
}

async function loadFiles() {
  const el = document.getElementById('fileList');
  el.innerHTML = '<p class="file-empty">Loading…</p>';
  try {
    const d = await api.get(`/files/${activeFolder}`);
    const files = (d.files || d.data?.files) || [];
    if (!files.length) { el.innerHTML = '<p class="file-empty">No files yet.</p>'; return; }
    el.innerHTML = files.map(f => `
      <div class="file-item ${f === activeFile ? 'active' : ''}" onclick="openFile('${f}')">
        <span>${f}</span>
        <span class="file-item-del" onclick="deleteFile(event,'${f}')">✕</span>
      </div>`).join('');
  } catch(e) { el.innerHTML = `<p class="file-empty" style="color:var(--red)">${e.response?.data?.detail || e.message}</p>`; }
}

async function openFile(name) {
  if (isDirty && !confirm('Discard unsaved changes?')) return;
  activeFile = name;
  document.getElementById('fileLabel').textContent = `${activeFolder} / ${name}`;
  document.getElementById('fileEditor').value = '…loading';
  setDirty(false);
  document.querySelectorAll('.file-item').forEach(el =>
    el.classList.toggle('active', el.querySelector('span').textContent === name));
  try {
    const d = await api.get(`/files/${activeFolder}/${name}`);
    document.getElementById('fileEditor').value = (d.content ?? d.data?.content) ?? '';
  } catch(e) { toast(e.response?.data?.detail || e.message, 'err'); }
}

async function saveFile() {
  if (!activeFile) return;
  const content = document.getElementById('fileEditor').value;
  try {
    await api.put(`/files/${activeFolder}/${activeFile}`, { content });
    setDirty(false); toast('Saved ✓');
  } catch(e) { toast(e.response?.data?.detail || e.message, 'err'); }
}

async function createFile() {
  const name = prompt('Filename (e.g. guide.md):');
  if (!name) return;
  const filename = name.endsWith('.md') ? name : name + '.md';
  try {
    const d = await api.post(`/files/${activeFolder}/${filename}`, {});
    toast(`Created ${filename}`); await loadFiles(); openFile(d.filename || filename);
  } catch(e) { toast(e.response?.data?.detail || e.message, 'err'); }
}

async function deleteFile(e, name) {
  e.stopPropagation();
  if (!confirm(`Delete "${name}"?`)) return;
  try {
    await api.delete(`/files/${activeFolder}/${name}`);
    if (activeFile === name) {
      activeFile = null;
      document.getElementById('fileLabel').textContent = 'no file selected';
      document.getElementById('fileEditor').value = '';
      setDirty(false);
    }
    toast(`Deleted ${name}`); await loadFiles();
  } catch(e) { toast(e.response?.data?.detail || e.message, 'err'); }
}

function onEdit() { setDirty(true); }

// ─── Boot ──────────────────────────────────────────────────────────────────────
// Auth (OAuth callback + redirect) is handled by api.js on load.
// We just wait for DOM ready and show the app if a valid token exists.
function boot() {
  const token = window.cognito.getToken();
  if (!token) return; // api.js will redirect to index.html

  const payload = window.cognito.parseJwtPayload(token);
  const email = payload.email || payload['cognito:username'] || payload.sub || 'user';
  document.getElementById('userEmail').textContent = email;
  document.getElementById('appScreen').style.display = 'flex';
  loadFiles();
}

// api.js runs its init() on DOMContentLoaded; we hook in after it settles
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => setTimeout(boot, 0));
} else {
  setTimeout(boot, 0);
}
</script>
</body>
</html>
