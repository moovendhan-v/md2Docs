version: "3.9"
services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infraai-mcp
    expose:
      - "80"
    volumes:
      - mcp_data:/srv/mcp-context
      - ./src:/app/src
    environment:
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "80"
      MCP_CONTENT_DIR: /srv/mcp-context
      MCP_PUBLIC_BASE_URL: "${MCP_PUBLIC_BASE_URL:-}"
      COGNITO_REGION: "${AWS_REGION:-}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID:-}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-}"
      COGNITO_DOMAIN: "${COGNITO_DOMAIN:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    restart: "no"
    depends_on:
      - api
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: infraai-api
    expose:
      - "80"
    volumes:
      - mcp_data:/srv/mcp-context
      - ./api/src:/app/src
    environment:
      MCP_CONTENT_DIR: /srv/mcp-context
      COGNITO_REGION: "${AWS_REGION:-}"
      COGNITO_USER_POOL_ID: "${COGNITO_USER_POOL_ID:-}"
      COGNITO_CLIENT_ID: "${COGNITO_CLIENT_ID:-}"
      AWS_REGION: "${AWS_REGION:-}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./Ui
      dockerfile: Dockerfile
    container_name: infraai-frontend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: infraai-caddy
    command: sh /etc/caddy/entrypoint.sh
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-entrypoint.sh:/etc/caddy/entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - mcp-server
      - api
      - frontend

volumes:
  mcp_data:
  caddy_data:
  caddy_config:
